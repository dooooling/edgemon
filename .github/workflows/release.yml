name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-agent:
    name: Build Agent Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (ARM64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build musl binary (Native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p edgemon-agent

      - name: Build musl binary (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p edgemon-agent

      - name: Package Binary & Calculate Checksum
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/edgemon-agent package/
          cd package
          tar -czf ../edgemon-agent-${{ matrix.target }}.tar.gz edgemon-agent
          cd ..
          sha256sum edgemon-agent-${{ matrix.target }}.tar.gz > edgemon-agent-${{ matrix.target }}.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            edgemon-agent-${{ matrix.target }}.tar.gz
            edgemon-agent-${{ matrix.target }}.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/*.tar.gz
            dist-artifacts/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
